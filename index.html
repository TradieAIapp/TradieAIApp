<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>TradieAIApp</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f3f4f6;color:#111827}header{background:#111827;color:#fff;padding:16px;position:sticky;top:0}h1{font-size:22px;margin:0 0 10px}.search,input,textarea,button{font:inherit}.search,input,textarea{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:9px;margin:5px 0 10px}.search{margin:0;border:0}.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{flex:1}main{max-width:720px;margin:auto;padding:16px}.card{background:white;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 4px #0001}.row{display:flex;gap:10px}.row>*{flex:1}button{border:0;border-radius:9px;padding:11px 14px;background:#111827;color:white;font-weight:600}.secondary{background:#e5e7eb;color:#111827}.hidden{display:none}.job{padding:12px;border:1px solid #e5e7eb;border-radius:10px;margin:8px 0}.muted{color:#6b7280;font-size:13px}.empty{text-align:center;padding:20px;color:#6b7280}.voice{display:flex;gap:8px}.voice input{flex:1}.voice button{margin:5px 0 10px}#sketch{width:100%;height:210px;border:1px solid #d1d5db;border-radius:9px;background:white;touch-action:none}.photo{max-width:100%;max-height:280px;border-radius:10px;margin-top:8px}</style></head><body><header><h1>TradieAIApp</h1><input id="search" class="search" placeholder="Search jobs or customers..."></header><main><div class="tabs"><button onclick="show('jobs')">Jobs</button><button class="secondary" onclick="show('new')">New Job</button></div><section id="jobs"><div class="card"><h2>Jobs</h2><div id="jobList"></div></div></section><section id="new" class="hidden"><div class="card"><h2>New Job</h2><input id="customer" placeholder="Customer name"><input id="jobName" placeholder="Job / site name"><textarea id="jobNotes" placeholder="Job notes"></textarea><button onclick="startJob()">Start Job</button></div></section><section id="job" class="hidden"><div class="card"><h2 id="jobTitle"></h2><div class="muted" id="jobCustomer"></div><textarea id="liveNotes" placeholder="Add job notes..."></textarea><button onclick="saveNotes()">Save Notes</button></div><div class="card"><h2>Add Opening</h2><div class="voice"><input id="room" placeholder="Room name (e.g. Kitchen)"><button onclick="voiceRoom()">🎙️ Speak</button></div><div id="voiceStatus" class="muted">Say the room name, then enter the measurement.</div><div class="row"><div><label>Height</label><input id="height" type="number" inputmode="decimal" placeholder="mm"></div><div><label>Width</label><input id="width" type="number" inputmode="decimal" placeholder="mm"></div></div><textarea id="openingNotes" placeholder="Opening notes..."></textarea><input id="photoInput" type="file" accept="image/*" capture="environment"><div id="photoPreview"></div><button onclick="addOpening()">Add Opening</button></div><div class="card"><h2>Opening Sketch</h2><canvas id="sketch"></canvas><div class="row"><button class="secondary" onclick="clearSketch()">Clear</button><button onclick="saveSketch()">Save Sketch</button></div></div><div class="card"><h2>Openings</h2><div id="openingList"></div></div></section></main><script>
let jobs=JSON.parse(localStorage.getItem('tradieJobs')||'[]'),current=null,photoData='';const $=id=>document.getElementById(id);function save(){localStorage.setItem('tradieJobs',JSON.stringify(jobs))}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function show(v){['jobs','new','job'].forEach(x=>$(x).classList.add('hidden'));$(v).classList.remove('hidden')}function renderJobs(f=''){let l=$('jobList');l.innerHTML='';let a=jobs.filter(j=>(j.name+' '+j.customer).toLowerCase().includes(f.toLowerCase()));if(!a.length){l.innerHTML='<div class="empty">No jobs yet. Create your first job.</div>';return}a.forEach(j=>{let d=document.createElement('div');d.className='job';d.innerHTML='<b>'+esc(j.name)+'</b><span>'+esc(j.customer)+'</span><div class="muted">'+j.openings.length+' openings</div>';d.onclick=()=>openJob(j.id);l.appendChild(d)})}$('search').oninput=e=>renderJobs(e.target.value);function startJob(){let j={id:Date.now(),name:$('jobName').value.trim()||'New Job',customer:$('customer').value.trim(),notes:$('jobNotes').value.trim(),openings:[]};jobs.unshift(j);save();openJob(j.id)}function openJob(id){current=jobs.find(j=>j.id===id);$('jobTitle').textContent=current.name;$('jobCustomer').textContent=current.customer||'';$('liveNotes').value=current.notes||'';renderOpenings();show('job')}function saveNotes(){current.notes=$('liveNotes').value;save();alert('Notes saved.')}function voiceRoom(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('Voice recognition is not supported here. Try Chrome on Android.');return}let r=new SR();r.lang='en-AU';r.onstart=()=>$('voiceStatus').textContent='Listening...';r.onresult=e=>{$('room').value=e.results[0][0].transcript.trim();$('voiceStatus').textContent='Room name captured.'};r.onerror=()=>$('voiceStatus').textContent='Could not hear it. Try again.';r.start()}$('photoInput').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{photoData=r.result;$('photoPreview').innerHTML='<img class="photo" src="'+photoData+'">'};r.readAsDataURL(f)};function addOpening(){let room=$('room').value.trim()||'Unnamed room',h=$('height').value,w=$('width').value;if(!h||!w){alert('Enter height and width.');return}current.openings.push({room,height:h,width:w,notes:$('openingNotes').value.trim(),photo:photoData});save();['room','height','width','openingNotes'].forEach(id=>$(id).value='');$('photoInput').value='';photoData='';$('photoPreview').innerHTML='';renderOpenings()}function renderOpenings(){let l=$('openingList');l.innerHTML='';if(!current.openings.length){l.innerHTML='<div class="empty">No openings added yet.</div>';return}current.openings.forEach((o,i)=>{let d=document.createElement('div');d.className='job';d.innerHTML='<b>'+esc(o.room)+'</b><div>Height × Width: '+esc(o.height)+' × '+esc(o.width)+' mm</div>'+(o.notes?'<p>'+esc(o.notes)+'</p>':'')+(o.photo?'<img class="photo" src="'+o.photo+'">':'')+'<br><button class="secondary" onclick="del('+i+')">Delete</button>';l.appendChild(d)})}function del(i){current.openings.splice(i,1);save();renderOpenings()}
const c=$('sketch'),ctx=c.getContext('2d');let drawing=false;function resize(){let r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;ctx.scale(d,d);ctx.lineWidth=2;ctx.lineCap='round'}resize();onresize=resize;function p(e){let r=c.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top}}function down(e){drawing=true;let q=p(e);ctx.beginPath();ctx.moveTo(q.x,q.y);e.preventDefault()}function move(e){if(!drawing)return;let q=p(e);ctx.lineTo(q.x,q.y);ctx.stroke();e.preventDefault()}c.onpointerdown=down;c.onpointermove=move;c.onpointerup=()=>drawing=false;c.ontouchstart=down;c.ontouchmove=move;c.ontouchend=()=>drawing=false;function clearSketch(){ctx.clearRect(0,0,c.width,c.height)}function saveSketch(){if(current){current.sketch=c.toDataURL();save();alert('Sketch saved.')}}renderJobs();
</script></body></html>
