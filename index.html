<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#111827"><title>TradieAIApp</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#111827}header{background:#111827;color:#fff;padding:18px 16px;position:sticky;top:0;z-index:5}header h1{margin:0;font-size:22px}.wrap{max-width:720px;margin:auto;padding:16px}.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px #0001}button,input,textarea,select{font:inherit}button{border:0;border-radius:10px;padding:12px 14px;background:#111827;color:#fff;font-weight:700;cursor:pointer}button.secondary{background:#e5e7eb;color:#111827}button.danger{background:#b91c1c}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-size:13px;font-weight:700;margin:10px 0 6px}input,textarea,select{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:9px;background:#fff}textarea{min-height:80px;resize:vertical}.voice{flex:0 0 auto;padding:9px 11px;background:#2563eb}.hidden{display:none}.job{padding:13px;border:1px solid #e5e7eb;border-radius:10px;margin:8px 0}.job b{display:block}.pill{display:inline-block;padding:5px 8px;border-radius:99px;background:#e5e7eb;font-size:12px;margin-top:5px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar button{flex:1;min-width:110px}.panelBtns button{min-width:55px}.builder{border:1px solid #d1d5db;border-radius:12px;padding:12px;background:#fafafa}.drawing{width:100%;aspect-ratio:1.5;border:2px solid #111827;background:white;position:relative;display:flex;overflow:hidden;margin:12px 0}.panel{flex:1;border-right:2px solid #111827;position:relative;display:flex;align-items:center;justify-content:center;min-width:0}.panel:last-child{border-right:0}.panel.selected{background:#dbeafe}.panel .mark{position:absolute;inset:10px;display:flex;align-items:center;justify-content:center;color:#2563eb;pointer-events:none}.panel .mark svg{width:72%;height:72%;overflow:visible}.panel .mark svg line,.panel .mark svg path{stroke:currentColor;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}.panel .mark.f{font-size:42px;font-weight:900}.hint{font-size:13px;color:#4b5563}.savedSketch{width:100%;margin-top:8px;border:1px solid #d1d5db;border-radius:8px}.openingCard{border:1px solid #d1d5db;border-radius:10px;padding:10px;margin-top:10px}.topnav{display:flex;gap:8px;margin-bottom:12px}.topnav button{flex:1}.muted{color:#6b7280;font-size:13px}
</style></head><body><header><div class="wrap" style="padding:0"><h1>TradieAIApp</h1></div></header><main class="wrap">
<section id="home"><div class="topnav"><button onclick="show('new')">+ New Job</button><button class="secondary" onclick="show('jobs')">Recent Jobs</button></div><div id="homeMsg" class="card"><b>Ready to go.</b><div class="muted">Create a job or open a recent one.</div></div></section>
<section id="jobs" class="hidden"><div class="card"><div class="row"><input id="search" placeholder="Search jobs or customers" oninput="renderJobs()"><button class="secondary" onclick="show('home')">Back</button></div></div><div id="jobList"></div></section>
<section id="new" class="hidden"><div class="card"><div class="toolbar"><button class="secondary" onclick="show('home')">← Back</button></div><h2>New Job</h2><label>Customer</label><input id="customer" placeholder="Customer name"><label>Job / Site</label><input id="site" placeholder="Job name or address"><label>Notes</label><textarea id="jobnotes" placeholder="Job notes"></textarea><button style="width:100%;margin-top:12px" onclick="createJob()">Create Job</button></div></section>
<section id="job" class="hidden"><div class="card"><div class="toolbar"><button class="secondary" onclick="show('jobs');renderJobs()">← Jobs</button><button class="secondary" onclick="show('home')">Home</button></div><h2 id="jobTitle"></h2><div id="jobInfo" class="muted"></div></div><div class="card"><h3>Add Opening</h3><label>Room name</label><div class="row"><input id="room" placeholder="Kitchen"><button class="voice" onclick="voiceField('room')">🎙️</button></div><div class="grid"><div><label>Height (mm)</label><div class="row"><input id="height" inputmode="numeric" placeholder="1200"><button class="voice" onclick="voiceField('height')">🎙️</button></div></div><div><label>Width (mm)</label><div class="row"><input id="width" inputmode="numeric" placeholder="1800"><button class="voice" onclick="voiceField('width')">🎙️</button></div></div></div><label>Type</label><select id="type" onchange="typeChanged()"><option>Window</option><option>Awning Window</option><option>Casement Window</option><option>Double Hung Window</option><option>Bifold Window</option><option>Door</option><option>Hinged Door</option><option>Sliding Door</option></select><button style="width:100%;margin-top:12px" onclick="openBuilder()">Build Opening</button></div><div class="card"><h3>Saved Openings</h3><div id="openings"></div></div></section>
<section id="builder" class="hidden"><div class="card"><button class="secondary" onclick="show('job')">← Back</button><h2>Build Opening</h2><div class="hint">Choose the number of panels, then tap the panel(s) that open.</div><div class="toolbar panelBtns" style="margin-top:12px"><button onclick="setPanels(1)">1</button><button onclick="setPanels(2)">2</button><button onclick="setPanels(3)">3</button><button onclick="setPanels(4)">4</button></div><div id="drawing" class="drawing"></div><div class="hint">Selected panel(s) are blue. Tap again to deselect.</div><div id="directionArea" class="builder hidden"><label>Opening direction</label><div id="directionButtons" class="toolbar"></div><div id="directionText" class="pill">No direction selected</div></div><button style="width:100%;margin-top:12px" onclick="saveOpening()">Save Opening</button></div></section>
</main><script>
let jobs=JSON.parse(localStorage.getItem('tradieJobs')||'[]'), current=null, panels=2, selected=[], direction='';
const typeDirections={
  'Window':[['Left','← Left'],['Right','Right →'],['Fixed','F — Fixed']],
  'Awning Window':[['Top','Awning V'],['Bottom','Awning V'],['Fixed','F — Fixed']],
  'Casement Window':[['Left','Casement V'],['Right','Casement V'],['Fixed','F — Fixed']],
  'Double Hung Window':[['Both','↕ Both Sashes'],['Fixed','F — Fixed']],
  'Bifold Window':[['Left','← Bifold Left'],['Right','Bifold Right →'],['Fixed','F — Fixed']],
  'Door':[['Left','← Left'],['Right','Right →']],
  'Hinged Door':[['Left','← Hinged Left'],['Right','Hinged Right →']],
  'Sliding Door':[['Sliding Left','⇆ Sliding Left'],['Sliding Right','⇆ Sliding Right']]
};
function typeChanged(){let t=currentType(); if(t==='Double Hung Window') panels=2; if(t==='Bifold Window' && panels<2) panels=4; selected=[]; direction=''; renderDirections(); draw();}
function currentType(){return document.getElementById('type').value}
function renderDirections(){let area=document.getElementById('directionButtons'),type=currentType();area.innerHTML=(typeDirections[type]||typeDirections['Window']).map(([v,l])=>`<button onclick="setDirection('${v}')">${l}</button>`).join('');}
function persist(){localStorage.setItem('tradieJobs',JSON.stringify(jobs))}
function show(id){['home','jobs','new','job','builder'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));if(id==='jobs')renderJobs();if(id==='home'){} }
function createJob(){let c=document.getElementById('customer').value.trim(),s=document.getElementById('site').value.trim();if(!c&& !s){alert('Enter a customer or job/site.');return}current={id:Date.now().toString(),customer:c,site:s,notes:document.getElementById('jobnotes').value.trim(),openings:[]};jobs.unshift(current);persist();openJob(current.id)}
function openJob(id){current=jobs.find(j=>j.id===id);if(!current)return;document.getElementById('jobTitle').textContent=current.site||current.customer||'Job';document.getElementById('jobInfo').textContent=[current.customer,current.site].filter(Boolean).join(' • ');renderOpenings();show('job')}
function renderJobs(){let q=(document.getElementById('search')?.value||'').toLowerCase();let list=jobs.filter(j=>(j.customer+' '+j.site).toLowerCase().includes(q));document.getElementById('jobList').innerHTML=list.length?list.map(j=>`<div class="card job" onclick="openJob('${j.id}')"><b>${esc(j.site||j.customer||'Job')}</b><span class="muted">${esc(j.customer||'')}</span><div><span class="pill">${j.openings.length} opening${j.openings.length===1?'':'s'}</span></div></div>`).join(''):'<div class="card">No jobs found.</div>'}
function renderOpenings(){let el=document.getElementById('openings');if(!current.openings.length){el.innerHTML='<div class="muted">No openings saved yet.</div>';return}el.innerHTML=current.openings.map((o,i)=>`<div class="openingCard"><b>${esc(o.room||'Unnamed room')} — ${esc(o.type)}</b><div class="muted">${o.height} × ${o.width} mm • ${o.panels} panels • ${o.openingPanels.length?('Opening: panels '+o.openingPanels.join(', ')+ ' — '+o.direction):'No opening selected'}</div><div class="drawing" style="aspect-ratio:2.2;margin:8px 0">${Array.from({length:o.panels},(_,p)=>`<div class="panel ${o.openingPanels.includes(p)?'selected':''}" style="height:100%">${o.openingPanels.includes(p)?`<span class="mark">${o.direction.includes('Left')?'←':o.direction.includes('Right')?'→':'⇆'}</span>`:''}</div>`).join('')}</div></div>`).join('')}
function openBuilder(){if(!current)return;let room=document.getElementById('room').value.trim(),h=document.getElementById('height').value.trim(),w=document.getElementById('width').value.trim(),type=currentType();if(!room||!h||!w){alert('Enter room, height and width first.');return}panels=type==='Sliding Door'?2:(type==='Bifold Window'?4:2);selected=[];direction='';document.getElementById('directionArea').classList.add('hidden');document.getElementById('directionText').textContent='No direction selected';renderDirections();draw();show('builder')}
function setPanels(n){panels=n;selected=[];direction='';document.getElementById('directionArea').classList.add('hidden');document.getElementById('directionText').textContent='No direction selected';draw()}
function openingMark(type,dir){
  if(dir==='Fixed') return '<span class="mark f">F</span>';
  if(type==='Awning Window') return '<span class="mark"><svg viewBox="0 0 100 100"><line x1="12" y1="12" x2="50" y2="88"/><line x1="88" y1="12" x2="50" y2="88"/></svg></span>';
  if(type==='Casement Window'){
    const left=dir==='Left';
    return '<span class="mark"><svg viewBox="0 0 100 100"><line x1="'+(left?'12':'88')+'" y1="50" x2="50" y2="12"/><line x1="'+(left?'12':'88')+'" y1="50" x2="50" y2="88"/></svg></span>';
  }
  if(type==='Double Hung Window') return '<span class="mark"><svg viewBox="0 0 100 100">'+(dir==='Both'||dir==='Top'?'<line x1="50" y1="50" x2="50" y2="12"/><path d="M42 22 L50 12 L58 22"/>':'')+(dir==='Both'?'<line x1="50" y1="50" x2="50" y2="88"/><path d="M42 78 L50 88 L58 78"/>':'')+'</svg></span>';
  if(type==='Window' && dir==='Left') return '<span class="mark"><svg viewBox="0 0 100 100"><line x1="12" y1="50" x2="50" y2="12"/><line x1="12" y1="50" x2="50" y2="88"/></svg></span>';
  if(type==='Window' && dir==='Right') return '<span class="mark"><svg viewBox="0 0 100 100"><line x1="88" y1="50" x2="50" y2="12"/><line x1="88" y1="50" x2="50" y2="88"/></svg></span>';
  const arrow=dir==='Left'?'←':dir==='Right'?'→':dir==='Sliding Left'?'⇆':dir==='Sliding Right'?'⇆':'';
  return arrow?'<span class="mark" style="font-size:34px;font-weight:900">'+arrow+'</span>':'';
}
function draw(){let d=document.getElementById('drawing'),type=currentType();d.innerHTML='';for(let i=0;i<panels;i++){let p=document.createElement('div');p.className='panel'+(selected.includes(i)?' selected':'');p.innerHTML=selected.includes(i)?openingMark(type,direction):'';p.onclick=()=>togglePanel(i);d.appendChild(p)}}
function togglePanel(i){selected=selected.includes(i)?selected.filter(x=>x!==i):[...selected,i];document.getElementById('directionArea').classList.toggle('hidden',selected.length===0);draw()}
function setDirection(d){direction=d;document.getElementById('directionText').textContent=d;draw()}
function saveOpening(){if(!selected.length){alert('Tap a panel to choose the opening.');return}if(!direction){alert('Choose an opening direction.');return}current.openings.push({room:document.getElementById('room').value.trim(),height:document.getElementById('height').value.trim(),width:document.getElementById('width').value.trim(),type:document.getElementById('type').value,panels,openingPanels:selected.slice(),direction});persist();document.getElementById('room').value='';document.getElementById('height').value='';document.getElementById('width').value='';renderOpenings();show('job')}
function voiceField(id){if(!('webkitSpeechRecognition'in window||'SpeechRecognition'in window)){alert('Voice recognition is not supported by this browser. Try Chrome on Android.');return}let R=window.SpeechRecognition||window.webkitSpeechRecognition,r=new R();r.lang='en-AU';r.interimResults=false;r.maxAlternatives=1;r.onresult=e=>{let t=e.results[0][0].transcript.trim();if(id==='room')document.getElementById(id).value=t;else document.getElementById(id).value=parseNumber(t)||t};r.onerror=()=>alert('Voice recognition could not hear that. Try again.');r.start()}
function parseNumber(s){s=s.toLowerCase().replace(/,/g,' ').trim();let m=s.match(/\d+(?:\.\d+)?/);if(m)return m[0];let nums={zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,twenty:20,thirty:30,forty:40,fifty:50,sixty:60,seventy:70,eighty:80,ninety:90};let words=s.replace(/-/g,' ').split(/\s+/),total=0,cur=0;for(let w of words){if(nums[w]!=null)cur+=nums[w];else if(w==='hundred'){cur*=100}else if(w==='thousand'){total+=cur*1000;cur=0}}let n=total+cur;return n||''}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
document.getElementById('type').addEventListener('change',()=>{selected=[];direction='';document.getElementById('directionArea').classList.add('hidden');renderDirections();draw()});
show('home');
</script></body></html>
