<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827">
<title>TradieAIApp</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#111827}button,input,textarea,select{font:inherit}header{background:#111827;color:#fff;padding:16px 18px;font-size:22px;font-weight:700;position:sticky;top:0;z-index:5}.wrap{max-width:760px;margin:auto;padding:14px}.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{flex:1;padding:13px;border:0;border-radius:10px;background:#d1d5db;font-weight:700}.tabs button.active{background:#111827;color:#fff}.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 5px #0001}.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0}.grow{flex:1}.label{font-size:13px;font-weight:700;color:#4b5563;margin:10px 0 5px}.input,textarea,select{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:9px;background:#fff}.input:focus,textarea:focus,select:focus{outline:2px solid #9ca3af}.btn{border:0;border-radius:9px;padding:11px 13px;background:#e5e7eb;font-weight:700;cursor:pointer}.btn.primary{background:#111827;color:#fff}.btn.green{background:#15803d;color:#fff}.btn.danger{background:#fee2e2;color:#991b1b}.btn.voice{min-width:48px;padding:11px;background:#eef2ff}.muted{color:#6b7280;font-size:13px}.hidden{display:none!important}.job{padding:13px;border:1px solid #e5e7eb;border-radius:10px;margin-top:8px;cursor:pointer}.job strong{display:block}.opening{border-top:1px solid #e5e7eb;margin-top:12px;padding-top:12px}.opening-head{display:flex;justify-content:space-between;gap:8px}.sketch-thumb{width:100%;max-height:220px;object-fit:contain;background:#fafafa;border:1px solid #e5e7eb;border-radius:8px;margin-top:8px}.measure{display:grid;grid-template-columns:1fr 1fr;gap:8px}.measure .mrow{display:flex;gap:6px}.measure .mrow .input{flex:1}.status{font-size:13px;color:#374151;margin-top:6px;min-height:18px}
#sketchCanvas{width:100%;height:300px;display:block;background:#fff;border:2px solid #d1d5db;border-radius:10px;touch-action:none}.tools{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin:8px 0}.tools button.active{background:#111827;color:#fff}.hint{font-size:12px;color:#6b7280;margin-top:5px}
</style></head>
<body>
<header>TradieAIApp</header>
<div class="wrap">
<div class="tabs"><button id="jobsTab" class="active" onclick="showPage('jobs')">Jobs</button><button id="newTab" onclick="showPage('new')">New Job</button></div>
<section id="jobsPage">
<div class="card"><input id="search" class="input" placeholder="Search jobs or customers" oninput="renderJobs()"></div>
<div class="card"><div class="row"><h3 style="margin:0" class="grow">Jobs</h3><button class="btn primary" onclick="showPage('new')">+ New Job</button></div><div id="jobsList"></div></div>
</section>
<section id="newPage" class="hidden">
<div class="card"><h3 style="margin-top:0">New Job</h3><div class="label">Customer</div><input id="customer" class="input" placeholder="Customer name"><div class="label">Job / Site</div><input id="site" class="input" placeholder="Job or site name"><div class="label">Notes</div><textarea id="jobNotes" rows="3" placeholder="Job notes"></textarea><button class="btn primary" style="margin-top:10px;width:100%" onclick="createJob()">Create Job</button></div>
</section>
<section id="jobPage" class="hidden">
<div class="card"><div class="row"><button class="btn" onclick="backJobs()">← Jobs</button><h3 id="jobTitle" class="grow" style="margin:0"></h3></div><div id="jobInfo" class="muted" style="margin-top:5px"></div></div>
<div class="card"><h3 style="margin-top:0">Add Opening</h3>
<div class="label">Room</div><div class="row"><input id="room" class="input grow" placeholder="e.g. Kitchen"><button class="btn voice" onclick="speakRoom()">🎙️</button></div><div id="voiceStatus" class="status"></div>
<div class="label">Measurements (mm)</div><div class="measure"><div><div class="muted">Height</div><div class="mrow"><input id="height" type="number" inputmode="numeric" class="input" placeholder="Height"><button class="btn voice" onclick="speakMeasurement('height')">🎙️</button></div></div><div><div class="muted">Width</div><div class="mrow"><input id="width" type="number" inputmode="numeric" class="input" placeholder="Width"><button class="btn voice" onclick="speakMeasurement('width')">🎙️</button></div></div></div><div id="measureStatus" class="status"></div>
<div class="label">Opening type</div><select id="sketchType" class="input"><option>Window</option><option>Door</option><option>Sliding Door</option></select>
<div class="label">Photo</div><input id="photo" type="file" accept="image/*" capture="environment" class="input">
<div class="label">Opening notes</div><textarea id="openingNotes" rows="2" placeholder="Opening notes"></textarea>
<div class="label">Sketch</div><div class="tools"><button id="frameTool" class="btn active" onclick="setTool('frame')">Draw Frame</button><button id="dividerTool" class="btn" onclick="setTool('divider')">Add Divider</button><button class="btn" onclick="clearSketch()">Clear</button></div><canvas id="sketchCanvas" width="700" height="300"></canvas><div class="hint">Draw a frame with your finger. Dividers snap straight and connect to the frame.</div><div class="row" style="margin-top:9px"><button class="btn green grow" onclick="saveSketch()">Save Sketch</button><button class="btn grow" onclick="undoSketch()">Undo</button></div><div id="sketchStatus" class="status"></div>
<button class="btn primary" style="width:100%;margin-top:12px" onclick="addOpening()">Add Opening</button>
</div>
<div class="card"><h3 style="margin-top:0">Openings</h3><div id="openings"></div></div>
</section>
</div>
<script>
const KEY='tradieai_jobs_v2';let jobs=JSON.parse(localStorage.getItem(KEY)||'[]'),current=null,tool='frame',frame=null,dividers=[],history=[],drawing=false,start=null;
const $=id=>document.getElementById(id);const canvas=$('sketchCanvas'),ctx=canvas.getContext('2d');
function saveData(){localStorage.setItem(KEY,JSON.stringify(jobs))}
function showPage(p){$('jobsPage').classList.toggle('hidden',p!=='jobs');$('newPage').classList.toggle('hidden',p!=='new');$('jobPage').classList.add('hidden');$('jobsTab').classList.toggle('active',p==='jobs');$('newTab').classList.toggle('active',p==='new');if(p==='jobs')renderJobs()}
function createJob(){let c=$('customer').value.trim(),s=$('site').value.trim();if(!c&& !s){alert('Enter a customer or job name');return}let j={id:Date.now(),customer:c,site:s,notes:$('jobNotes').value.trim(),openings:[],created:new Date().toLocaleDateString()};jobs.unshift(j);saveData();$('customer').value='';$('site').value='';$('jobNotes').value='';openJob(j.id)}
function renderJobs(){let q=($('search').value||'').toLowerCase(),list=jobs.filter(j=>(j.customer+' '+j.site+' '+j.notes).toLowerCase().includes(q));$('jobsList').innerHTML=list.length?list.map(j=>`<div class="job" onclick="openJob(${j.id})"><strong>${esc(j.site||'Untitled Job')}</strong><span>${esc(j.customer||'No customer')} · ${j.openings.length} opening${j.openings.length===1?'':'s'}</span></div>`).join(''):'<div class="muted" style="margin-top:10px">No jobs yet.</div>'}
function openJob(id){current=jobs.find(j=>j.id===id);if(!current)return;$('jobsPage').classList.add('hidden');$('newPage').classList.add('hidden');$('jobPage').classList.remove('hidden');$('jobsTab').classList.remove('active');$('newTab').classList.remove('active');$('jobTitle').textContent=current.site||'Untitled Job';$('jobInfo').textContent=(current.customer||'No customer')+(current.notes?' · '+current.notes:'');renderOpenings();resetForm()}
function backJobs(){current=null;showPage('jobs')}
function renderOpenings(){let o=current.openings||[];$('openings').innerHTML=o.length?o.map((x,i)=>`<div class="opening"><div class="opening-head"><div><strong>${esc(x.room||'Unnamed room')}</strong><div class="muted">${esc(x.type||'Window')} · ${x.height||''} × ${x.width||''} mm</div></div><button class="btn danger" onclick="deleteOpening(${i})">Delete</button></div>${x.photo?`<img class="sketch-thumb" src="${x.photo}">`:''}${x.sketch?`<img class="sketch-thumb" src="${x.sketch}">`:''}${x.notes?`<div style="margin-top:7px">${esc(x.notes)}</div>`:''}</div>`).join(''):'<div class="muted">No openings added yet.</div>'}
function deleteOpening(i){current.openings.splice(i,1);saveData();renderOpenings()}
function resetForm(){['room','height','width','openingNotes'].forEach(id=>$(id).value='');$('photo').value='';$('voiceStatus').textContent='';$('measureStatus').textContent='';$('sketchStatus').textContent='';$('sketchType').value='Window';clearSketch()}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function recognition(){return window.SpeechRecognition||window.webkitSpeechRecognition}
function speakRoom(){let R=recognition();if(!R){$('voiceStatus').textContent='Voice recognition is not supported in this browser.';return}let r=new R();r.lang='en-AU';r.interimResults=false;r.onstart=()=>{$('voiceStatus').textContent='Listening for room name…'};r.onresult=e=>{$('room').value=e.results[0][0].transcript.trim();$('voiceStatus').textContent='Room captured.'};r.onerror=()=>{$('voiceStatus').textContent='Could not hear that. Try again.'};r.start()}
function wordsToNumber(text){text=text.toLowerCase().replace(/-/g,' ');let m=text.match(/\d+(?:\.\d+)?/);if(m)return Number(m[0]);let small={zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,twenty:20,thirty:30,forty:40,fifty:50,sixty:60,seventy:70,eighty:80,ninety:90};let total=0,cur=0,found=false;for(let w of text.split(/\s+/)){if(w==='and'||w==='millimetres'||w==='millimeter'||w==='millimeters'||w==='mm')continue;if(small[w]!=null){cur+=small[w];found=true}else if(w==='hundred'){cur=(cur||1)*100}else if(w==='thousand'){total+=(cur||1)*1000;cur=0}else if(w==='point'){break}}return found?total+cur:null}
function speakMeasurement(id){let R=recognition();if(!R){$('measureStatus').textContent='Voice recognition is not supported in this browser.';return}let r=new R();r.lang='en-AU';r.interimResults=false;r.onstart=()=>{$('measureStatus').textContent='Listening for '+id+'…'};r.onresult=e=>{let t=e.results[0][0].transcript,n=wordsToNumber(t);if(n!=null){$(id).value=Math.round(n);$('measureStatus').textContent=id[0].toUpperCase()+id.slice(1)+' set to '+Math.round(n)+' mm.'}else $('measureStatus').textContent='Could not find a measurement in “'+t+'”. Try saying the number in millimetres.'};r.onerror=()=>{$('measureStatus').textContent='Could not hear that. Try again.'};r.start()}
function setTool(t){tool=t;$('frameTool').classList.toggle('active',t==='frame');$('dividerTool').classList.toggle('active',t==='divider')}
function pos(e){let r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}
function snapPoint(p){let pts=[];if(frame)pts=[{x:frame.x,y:frame.y},{x:frame.x+frame.w,y:frame.y},{x:frame.x,y:frame.y+frame.h},{x:frame.x+frame.w,y:frame.y+frame.h},{x:frame.x+frame.w/2,y:frame.y},{x:frame.x+frame.w/2,y:frame.y+frame.h},{x:frame.x,y:frame.y+frame.h/2},{x:frame.x+frame.w,y:frame.y+frame.h/2}];for(let d of dividers){pts.push(d.a,d.b)}let best=p,bd=18;for(let q of pts){let d=Math.hypot(p.x-q.x,p.y-q.y);if(d<bd){bd=d;best={x:q.x,y:q.y}}}return best}
function lineSnap(a,b){let dx=Math.abs(b.x-a.x),dy=Math.abs(b.y-a.y);if(dx>=dy){b.y=a.y}else b.x=a.x;return b}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.lineWidth=5;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#111827';if(frame){ctx.strokeRect(frame.x,frame.y,frame.w,frame.h)}dividers.forEach(d=>{ctx.beginPath();ctx.moveTo(d.a.x,d.a.y);ctx.lineTo(d.b.x,d.b.y);ctx.stroke()})}
function pushHistory(){history.push({frame:frame?{...frame}:null,dividers:dividers.map(d=>({a:{...d.a},b:{...d.b}}))});if(history.length>30)history.shift()}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();drawing=true;start=snapPoint(pos(e));canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointerup',e=>{if(!drawing)return;e.preventDefault();drawing=false;let end=snapPoint(pos(e));pushHistory();if(tool==='frame'){let a=start,b=end;let x=Math.min(a.x,b.x),y=Math.min(a.y,b.y),w=Math.abs(a.x-b.x),h=Math.abs(a.y-b.y);if(w>20&&h>20){frame={x,y,w,h};dividers=[]}}else if(tool==='divider'&&frame){end=lineSnap(start,end);let a={...start},b={...end};if(a.x<frame.x+20)a.x=frame.x;if(a.x>frame.x+frame.w-20)a.x=frame.x+frame.w;if(a.y<frame.y+20)a.y=frame.y;if(a.y>frame.y+frame.h-20)a.y=frame.y+frame.h;if(Math.abs(b.x-a.x)>=Math.abs(b.y-a.y)){b.y=a.y;b.x=Math.max(frame.x,Math.min(frame.x+frame.w,b.x))}else{b.x=a.x;b.y=Math.max(frame.y,Math.min(frame.y+frame.h,b.y))}dividers.push({a,b})}draw();canvas.releasePointerCapture(e.pointerId)});
function clearSketch(){frame=null;dividers=[];history=[];draw()}
function undoSketch(){let h=history.pop();if(h){frame=h.frame;dividers=h.dividers;draw()}}
function saveSketch(){if(!frame){$('sketchStatus').textContent='Draw the outer frame first.';return}let data=canvas.toDataURL('image/png');window.currentDraftSketch={image:data,type:$('sketchType').value};$('sketchStatus').textContent='Sketch saved to this opening.'}
function addOpening(){if(!current)return;let room=$('room').value.trim(),h=$('height').value,w=$('width').value;if(!room){alert('Enter or speak the room name');return}if(!h||!w){alert('Enter height and width');return}if(!window.currentDraftSketch&&frame)saveSketch();let file=$('photo').files[0];let finish=photo=>{current.openings.push({room,height:Number(h),width:Number(w),type:$('sketchType').value,notes:$('openingNotes').value.trim(),photo:photo||'',sketch:window.currentDraftSketch?.image||'',sketchType:window.currentDraftSketch?.type||$('sketchType').value});saveData();renderOpenings();resetForm()};if(file){let r=new FileReader();r.onload=()=>finish(r.result);r.readAsDataURL(file)}else finish('')}
renderJobs();draw();
</script></body></html>
